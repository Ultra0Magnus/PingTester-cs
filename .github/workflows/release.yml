name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extraire la version (sans le 'v')
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Installer Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publier l'application
        run: >
          dotnet publish PingTester/PingTester.csproj
          -c Release -r win-x64 --self-contained
          -o publish
          -p:Version=${{ steps.ver.outputs.VERSION }}

      - name: Télécharger les releases précédentes (pour les deltas)
        run: >
          vpk download github
          --repoUrl https://github.com/Ultra0Magnus/PingTester-cs
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
        continue-on-error: true

      - name: Packager avec Velopack
        run: >
          vpk pack
          --packId PingTester
          --packVersion ${{ steps.ver.outputs.VERSION }}
          --packDir publish
          --outputDir releases
          --icon PingTester/Assets/app.ico

      - name: Publier sur GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/Ultra0Magnus/PingTester-cs
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag ${{ github.ref_name }}
